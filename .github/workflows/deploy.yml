name: Validate allknowdev

# Deployment is handled by Vercel. This workflow guards data quality:
# every push must pass the static-structure and directory-data checks.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate static site
        run: |
          test -f index.html
          test -f assets/css/style.css
          test -f assets/js/main.js
          test -f assets/js/guide.js
          test -f assets/js/directory.js
          test -d assets/images
          test -f pages/directory.html
          test -f pages/learning.html
          test -f pages/software-development.html
          test -f pages/ai-engineering.html
          test -f pages/cloud-engineering.html
          test -f pages/cybersecurity.html
          echo "Static site structure is valid."
      - name: Validate directory data
        run: |
          python3 - <<'EOF'
          import json, re, sys

          REQUIRED = ("id", "provider", "product", "category", "what_free",
                      "official_url", "last_verified", "confidence")
          DATE = re.compile(r"^\d{4}-\d{2}-\d{2}$")
          URL = re.compile(r"^https://")
          CONF = {"official", "reported"}
          errors = []
          seen_ids = set()
          files = ["data/ai-ml.json", "data/cloud-hosting.json", "data/databases-auth.json",
                   "data/devtools.json", "data/apis-services.json", "data/learning.json"]

          for path in files:
              try:
                  entries = json.load(open(path, encoding="utf-8"))
              except Exception as exc:
                  errors.append(f"{path}: invalid JSON ({exc})")
                  continue
              if not isinstance(entries, list) or not entries:
                  errors.append(f"{path}: must be a non-empty array")
                  continue
              for i, entry in enumerate(entries):
                  if not isinstance(entry, dict):
                      errors.append(f"{path}[{i}]: entry must be an object")
                      continue
                  where = f"{path}[{i}] ({entry.get('id', '?')})"
                  for field in REQUIRED:
                      if entry.get(field) in (None, ""):
                          errors.append(f"{where}: missing field '{field}'")
                  if entry.get("id") in seen_ids:
                      errors.append(f"{where}: duplicate id")
                  seen_ids.add(entry.get("id"))
                  for url_field in ("official_url", "pricing_url"):
                      value = entry.get(url_field)
                      if value is not None and not URL.match(value):
                          errors.append(f"{where}: {url_field} must be https")
                  if not DATE.match(str(entry.get("last_verified", ""))):
                      errors.append(f"{where}: last_verified must be YYYY-MM-DD")
                  if entry.get("confidence") not in CONF:
                      errors.append(f"{where}: confidence must be official|reported")

          try:
              stacks = json.load(open("data/stacks.json", encoding="utf-8"))
              all_ids = seen_ids | {s.get("id") for s in stacks.get("stacks", [])}
              for band, ids in stacks.get("budget_picks", {}).items():
                  for pid in ids:
                      if pid not in all_ids:
                          errors.append(f"data/stacks.json budget_picks.{band}: unknown id '{pid}'")
          except Exception as exc:
              errors.append(f"data/stacks.json: invalid JSON ({exc})")

          if errors:
              print("\n".join("FAIL " + e for e in errors))
              sys.exit(1)
          print(f"OK: {len(files)} data files, {len(seen_ids)} entries validated.")
          EOF
